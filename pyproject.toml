[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-nexus-orphanproof"
version = "0.3.0"
description = "Read-only evidence memory retrieval API for Cloud Nexus OrphanProof."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "pydantic",
    "pydantic-settings",
    "psycopg[binary]",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "ruff",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    "scripts/apply_database_migrations.py",
    "scripts/load_synthetic_seed.py",
    "tests/test_database_migration_contract.py",
    "tests/test_synthetic_seed_contract.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
